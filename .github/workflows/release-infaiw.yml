name: Release infaiw

on:
  push:
    tags:
      - "infaiw-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOLANG_CROSS_VERSION: v1.26.2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare release
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#infaiw-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid infaiw release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build infaiw artifacts
        run: |
          docker run \
            --rm \
            -e INFAIW_VERSION \
            -v "$PWD":/go/src/github.com/dipankardas011/infai \
            -w /go/src/github.com/dipankardas011/infai \
            ghcr.io/goreleaser/goreleaser-cross:${GOLANG_CROSS_VERSION} \
            release --snapshot --config .goreleaser.infaiw.yaml --clean
        env:
          INFAIW_VERSION: ${{ steps.release.outputs.version }}

      - name: Publish GitHub release
        shell: bash
        run: |
          assets=(dist/infaiw_*.tar.gz dist/infaiw_checksums.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "infaiw v${{ steps.release.outputs.version }}" \
              --notes-from-tag
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update OBS package metadata
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin obs-packaging:refs/remotes/origin/obs-packaging || true
          if git show-ref --verify --quiet refs/remotes/origin/obs-packaging; then
            git checkout -B obs-packaging origin/obs-packaging
          else
            git checkout --orphan obs-packaging
            git rm -rf .
            git checkout origin/main -- .obs packaging/obs
          fi

          for template in packaging/obs/*.in; do
            output="${template%.in}"
            sed "s/@VERSION@/${VERSION}/g" "$template" > "$output"
          done
          chmod +x packaging/obs/debian.rules

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .obs packaging/obs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(obs): update infaiw to ${VERSION}"
          git push origin HEAD:obs-packaging

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: dipankardas011/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          amd64_archive="dist/infaiw_${VERSION}_darwin_amd64.tar.gz"
          arm64_archive="dist/infaiw_${VERSION}_darwin_arm64.tar.gz"
          amd64_sha="$(sha256sum "$amd64_archive")"
          amd64_sha="${amd64_sha%% *}"
          arm64_sha="$(sha256sum "$arm64_archive")"
          arm64_sha="${arm64_sha%% *}"

          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/infaiw.rb <<EOF
          cask "infaiw" do
            arch arm: "arm64", intel: "amd64"

            version "$VERSION"
            sha256 arm: "$arm64_sha", intel: "$amd64_sha"

            url "https://github.com/dipankardas011/infai/releases/download/infaiw-v#{version}/infaiw_#{version}_darwin_#{arch}.tar.gz"
            name "infaiw"
            desc "Agent and workflow engine for infai"
            homepage "https://github.com/dipankardas011/infai"

            binary "infaiw"

            postflight do
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/infaiw"]
            end
          end
          EOF

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/infaiw.rb
          if git -C homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C homebrew-tap commit -m "Update infaiw to ${VERSION}"
          git -C homebrew-tap push
